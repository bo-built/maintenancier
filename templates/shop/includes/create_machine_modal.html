<div class="modal fade" x-ref="createMachineModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create a New Machine</h5>
                <button type="button" class="btn-close" aria-label="Close" @click="closeMachineModal()">
                    <span aria-hidden="true"></span>
                </button>
            </div>
            <form method="POST" @submit.prevent="submitNewMachine($event.target)">
                <div class="modal-body">
                {% csrf_token %}
                    {{machine_form.as_p}}
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
