<div class="modal fade" x-ref="createTaskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create a New Mainetenance Item</h5>
                <button type="button" class="btn-close" aria-label="Close" @click="closeTaskModal()">
                    <span aria-hidden="true"></span>
                </button>
            </div>
            <form>
                <div class="modal-body">
                {% csrf_token %}
                    {{schedule_item_form.as_p}}
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" @click="submitTask()">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
