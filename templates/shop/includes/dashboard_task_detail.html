<div class="alert":class="{
        'alert-info': task.status === 'pending',
        'alert-success': task.status === 'done',
        'alert-danger': task.status === 'overdue'
    }">

    <div class="row">
        <div class="col-3" x-text="task.machine_name || 'General Shop'"></div>
        <div class="col-3" x-text="task.task_name"></div>
        <div class="col-2" x-text="task.interval"></div>
        <div class="col-2" x-text="task.due_date"></div>
        <div class="col-2">
            <div class="form-check form-switch">
                <input
                    class="form-check-input"
                    type="checkbox"
                    :id="'task-switch-' + task.pk"
                    :checked="task.status === 'done'"
                    @change="updateTaskStatus(task, $event.target.checked)"
                >
                <label class="form-check-label" :for="'task-switch-' + task.pk"></label>
            </div>
        </div>
    </div>
    <hr />
    <div class="row">
        <div class="col-10">
            <div class="col" x-text="task.description || 'no description'"></div>
        </div>
        <div class="col-2">
            <button
                type="button"
                class="btn btn-danger btn-sm"
                @click="confirmDismissTask(group, task)">X</button>
        </div>
    </div>
</div>
