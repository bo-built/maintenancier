<table class="table">
    <thead>
        <tr>
            <th>Item</th>
            <th>Done By</th>
            <th>Date Done</th>
        </tr>
    </thead>
    <template x-for="log_item in log_entries.filter(entry => !selectedTask || entry.task.pk == selectedTask.pk)" :key="log_item.pk">
        <tbody>
            <tr>
                <td x-text="log_item.task_name"></td>
                <td x-text="log_item.done_by.name"></td>
                <td x-text="new Date(log_item.done_date).toLocaleDateString()"></td>
            </tr>
        </tbody>
    </template>
</table>
