<table class="table">
    <thead>
        <tr>
            <th>Item</th>
            <th>Done By</th>
            <th>Date Done</th>
        </tr>
    </thead>
    <template x-for="log_item in log_entries.filter(entry => !selectedTask || entry.task.pk == selectedTask.pk)" :key="log_item.pk">
        <tbody>
            <tr :style="log_item.notes ? 'border-bottom: 1px solid #fff;' : 'border-bottom: 3px solid #000;'">
                <td x-text="log_item.task_name"></td>
                <td x-text="log_item.done_by.name"></td>
                <td x-text="new Date(log_item.done_date).toLocaleDateString()"></td>
            </tr>
            <tr x-show="log_item.notes"  style="border-bottom: 3px solid #000;">
                <td colspan="100%">
                    <strong>notes:</strong>
                    <div  x-text="log_item.notes"></div>
                </td>
            </tr>
        </tbody>
    </template>
</table>
